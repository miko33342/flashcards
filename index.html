<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DALF C1 闪卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --ink: #22201c; --ink2: #5d584f; --ink3: #8f887c;
  --line: #e4ddd0; --line2: #efe9de; --accent: #1f5f8b; --accent-soft: #e3eef6;
  --ok: #2f7d4f; --ok-soft: #e2f1e7; --bad: #b23a3a; --bad-soft: #f8e4e2; --key: #fff4d6; --key-line: #e8cf8a;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1a1917; --panel: #22211e; --ink: #ebe6dc; --ink2: #b3ac9f; --ink3: #857e72;
  --line: #3a3732; --line2: #2e2c28; --accent: #7fb6dc; --accent-soft: #23323d;
  --ok: #6cc08c; --ok-soft: #1f3327; --bad: #e58a84; --bad-soft: #3d2322; --key: #3a3222; --key-line: #6b5a32;
}}
:root[data-theme="dark"] {
  --bg: #1a1917; --panel: #22211e; --ink: #ebe6dc; --ink2: #b3ac9f; --ink3: #857e72;
  --line: #3a3732; --line2: #2e2c28; --accent: #7fb6dc; --accent-soft: #23323d;
  --ok: #6cc08c; --ok-soft: #1f3327; --bad: #e58a84; --bad-soft: #3d2322; --key: #3a3222; --key-line: #6b5a32;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- shell (same language as the exam page) ---------- */
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
header h1 small { color: var(--ink3); font-weight: 400; margin-left: 6px; }
.grow { flex: 1; }
.tool { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-size: 13px; white-space: nowrap; text-decoration: none; color: inherit; }
.tool:hover { border-color: var(--ink3); }
.tool.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn-main { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
.seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg2 button { border: 0; background: var(--panel); padding: 5px 12px; font-size: 13px; color: var(--ink2); }
.seg2 button + button { border-left: 1px solid var(--line); }
.seg2 button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

main { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; color: var(--ink2); }
.pills button:hover { border-color: var(--accent); color: var(--accent); }
.pills button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.stats { font-size: 12.5px; color: var(--ink2); display: flex; align-items: center; gap: 12px; }
.stats b { color: var(--ink); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.link { border: 0; background: none; padding: 0; color: var(--ink3); font-size: 12.5px; text-decoration: underline; }
.link:hover { color: var(--accent); }

/* ---------- card ---------- */
.deck { max-width: 620px; margin: 0 auto; }
.meta { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink3); margin-bottom: 8px; }
.badge { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12px; }
.progress { height: 5px; border-radius: 3px; background: var(--line2); overflow: hidden; margin-bottom: 16px; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.card { perspective: 1200px; cursor: pointer; height: 420px; }
.card-inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.card-inner.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line); border-radius: 16px;
  background: var(--panel); padding: 20px 22px; display: flex; flex-direction: column; box-shadow: 0 6px 22px rgba(0,0,0,.06); }
.face.back { transform: rotateY(180deg); background: var(--key); border-color: var(--key-line); }
.face-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; letter-spacing: .08em; color: var(--ink3); text-transform: uppercase; }
.icons { display: flex; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; }
.ic { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; font-size: 14px; padding: 0; color: var(--ink2); }
.ic:hover { border-color: var(--accent); color: var(--accent); }
.ic.wide { width: auto; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.ic.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.face-mid { flex: 1; display: flex; flex-direction: column; text-align: center; min-height: 0; overflow-y: auto; cursor: text; margin: 10px 0; }
.face-mid > .in { margin: auto 0; }
.word { font: 600 32px/1.2 var(--serif); margin: 0 0 8px; }
.type { font-size: 13px; color: var(--ink3); }
.zh { font: 600 22px/1.35 var(--sans); margin: 0 0 12px; }
.quote { text-align: left; background: color-mix(in srgb, var(--panel) 70%, transparent); border: 1px solid var(--key-line); border-radius: 10px; padding: 10px 12px;
  font: italic 15.5px/1.55 var(--serif); }
.quote strong { font-style: normal; color: var(--accent); }
.quote .lbl { display: block; font: 600 11px var(--sans); font-style: normal; letter-spacing: .06em; color: var(--ink3); margin-bottom: 4px; }
.expansion { text-align: left; font-size: 13.5px; color: var(--ink2); margin-top: 10px; line-height: 1.6; white-space: pre-line; }
.face-bot { border-top: 1px solid var(--line2); padding-top: 10px; display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--ink3); }
.face.back .face-bot { border-top-color: var(--key-line); }
.face-bot .hint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--serif); font-style: italic; }
.face-bot .flip { color: var(--accent); white-space: nowrap; font-weight: 600; }
.nav { display: flex; gap: 10px; margin-top: 16px; }
.nav button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 11px 12px; font-size: 14px; font-weight: 600; }
.nav button:hover { border-color: var(--ink3); }
.nav .next { background: var(--accent); border-color: var(--accent); color: #fff; }
.nav .master { flex: 1.2; background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.nav .master.done { background: var(--ok); color: #fff; }
.under { margin-top: 12px; text-align: center; font-size: 12.5px; color: var(--ink3); }
.empty { text-align: center; color: var(--ink3); padding: 60px 0; }

/* ---------- list ---------- */
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: 15px var(--sans); margin-bottom: 12px; }
.search:focus, .modal input:focus, .modal select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.rows { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
.row { display: grid; grid-template-columns: 30px 1fr auto; gap: 4px 10px; padding: 11px 14px; border-top: 1px solid var(--line2); align-items: start; }
.row:first-child { border-top: 0; }
.row .chk { border: 0; background: none; padding: 2px 0 0; font-size: 17px; color: var(--line); }
.row .chk.done { color: var(--ok); }
.row .fr { font: 600 16.5px var(--serif); }
.row .ty { font-size: 12px; color: var(--ink3); margin-left: 6px; font-weight: 400; font-family: var(--sans); }
.row .zhs { font-size: 14px; margin-top: 2px; }
.row .q { font: italic 13.5px/1.5 var(--serif); color: var(--ink2); margin-top: 4px; }
.row .q strong { font-style: normal; color: var(--accent); }
.row .ex { font-size: 12.5px; color: var(--ink3); margin-top: 3px; white-space: pre-line; }
.row .acts { display: flex; gap: 4px; }
.row .acts button { border: 0; background: none; padding: 4px 6px; border-radius: 6px; color: var(--ink3); font-size: 14px; }
.row .acts button:hover { background: var(--line2); color: var(--accent); }
.row .acts .del:hover { color: var(--bad); }

/* ---------- modal + toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; place-items: center; z-index: 20; padding: 16px; }
.modal-bg.open { display: grid; }
.modal { background: var(--panel); border-radius: 14px; padding: 20px 22px; width: min(520px, 100%); max-height: 90vh; overflow: auto; border: 1px solid var(--line); }
.modal h3 { margin: 0 0 6px; font-size: 16px; }
.modal label { display: block; font-size: 12.5px; color: var(--ink2); margin: 12px 0 4px; }
.modal input, .modal select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 15px var(--sans); }
.modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--panel); border-radius: 12px; padding: 10px 16px;
  font-size: 13.5px; max-width: calc(100vw - 32px); box-shadow: 0 8px 28px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.open { opacity: 1; }

@media (max-width: 560px) {
  header h1 small, .opt-hide-sm { display: none; }
  .card { height: 460px; }
  .word { font-size: 27px; } .zh { font-size: 21px; }
  .modal .two { grid-template-columns: 1fr; }
  .nav button { padding: 11px 6px; font-size: 13.5px; }
}
</style>
</head>
<body>
<header>
  <h1>DALF C1 闪卡<small>听力 · 阅读 · Dictée 生词与表达</small></h1>
  <span class="grow"></span>
  <span class="seg2"><button id="tabCards" class="on">闪卡</button><button id="tabList">清单</button></span>
  <button class="tool" id="btnExport" title="导出全部卡片（含掌握进度）为 cards.json">导出</button>
  <button class="tool" id="btnImport" title="导入 cards.json 并合并，不覆盖已有卡片">导入</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <button class="tool" id="btnAdd">＋ 新增</button>
  <button class="tool" id="btnTheme" title="切换深浅色">◐</button>
</header>

<main>
  <div class="bar">
    <div class="pills" id="pills"></div>
    <span class="grow"></span>
    <div class="stats">
      <span><span class="dot" style="background:var(--ok)"></span>已掌握 <b id="nMastered">0</b></span>
      <span><span class="dot" style="background:var(--key-line)"></span>待复习 <b id="nReview">0</b></span>
      <button class="tool" id="btnOnlyTodo" title="只显示还没掌握的卡片">只看未掌握</button>
      <button class="link" id="btnReset" title="把所有卡片标回未掌握">重置进度</button>
    </div>
  </div>

  <!-- cards -->
  <section id="viewCards">
    <div class="deck" id="deck">
      <div class="meta"><span id="pos"></span><span class="badge" id="catBadge"></span></div>
      <div class="progress"><div id="progress"></div></div>
      <div class="card" id="card">
        <div class="card-inner" id="cardInner">
          <div class="face front">
            <div class="face-top"><span>Français · C1</span>
              <span class="icons">
                <button class="ic wide" id="btnSpeed" title="切换朗读语速">1.0×</button>
                <button class="ic" id="btnCopy" title="复制">⧉</button>
                <button class="ic" id="btnDict" title="在 Larousse 词典里查">📖</button>
                <button class="ic primary" id="btnSpeak" title="朗读">🔊</button>
              </span>
            </div>
            <div class="face-mid"><div class="in"><h2 class="word" id="word"></h2><div class="type" id="type"></div></div></div>
            <div class="face-bot"><span class="hint" id="hint"></span><span class="flip">点击翻转 ⟳</span></div>
          </div>
          <div class="face back">
            <div class="face-top"><span>释义与语境</span>
              <span class="icons"><span class="badge" id="typeBack"></span><button class="ic" id="btnSpeak2" title="朗读">🔊</button></span>
            </div>
            <div class="face-mid"><div class="in">
              <h3 class="zh" id="zh"></h3>
              <div class="quote"><span class="lbl">原句<span id="source"></span></span><span id="quote"></span></div>
              <div class="expansion" id="expansion"></div>
            </div></div>
            <div class="face-bot"><span><span class="opt-hide-sm">空格翻转 · ← → 切换 · M 掌握</span></span><span class="flip">点击返回正面</span></div>
          </div>
        </div>
      </div>
      <div class="nav">
        <button id="btnPrev">← 上一个</button>
        <button class="master" id="btnMaster">标为已掌握</button>
        <button class="next" id="btnNext">下一个 →</button>
      </div>
      <div class="under"><button class="link" id="btnShuffle">随机打乱顺序</button></div>
    </div>
    <p class="empty" id="deckEmpty" hidden>这个筛选下没有卡片。</p>
  </section>

  <!-- list -->
  <section id="viewList" hidden>
    <input class="search" id="search" type="search" placeholder="搜索法语、中文释义、原句…">
    <div class="rows" id="rows"></div>
  </section>
</main>

<div class="modal-bg" id="addModal"><form class="modal" id="addForm">
  <h3>新增卡片</h3>
  <label>法语词或表达 *</label><input id="fFr" required placeholder="avoir la cote" spellcheck="false">
  <div class="two">
    <div><label>词性</label><input id="fType" placeholder="loc. verb. / n. f. / adj." spellcheck="false"></div>
    <div><label>分类</label><select id="fCat"></select></div>
  </div>
  <label>中文释义 *</label><input id="fZh" required>
  <label>原句</label><input id="fQuote" spellcheck="false">
  <label>拓展（同义替换、用法）</label><input id="fExp">
  <div class="acts"><button type="button" class="tool" id="addCancel">取消</button><button class="btn-main">加入</button></div>
</form></div>
<div class="toast" id="toast"></div>

<script>
const initialVocabulary = [
 {
  "id": 1,
  "fr": "avoir la cote",
  "type": "loc. verb.",
  "category": "idiom",
  "zh": "非常受青睐、走红、吃香",
  "quote": "« ...avec les épices qui ont la cote en Suisse. »",
  "expansion": "同义替换：être très populaire / être très prisé(e)",
  "mastered": false
 },
 {
  "id": 2,
  "fr": "caracoler en tête",
  "type": "loc. verb.",
  "category": "idiom",
  "zh": "遥遥领先、高居榜首",
  "quote": "« ...gingembre, piment et poivre caracolent en tête... »",
  "expansion": "赛马引申：指在统计数据或经济排名中处于第一位",
  "mastered": false
 },
 {
  "id": 3,
  "fr": "prendre l'ascenseur",
  "type": "loc. verb.",
  "category": "idiom",
  "zh": "（价格等）急剧攀升、飙升",
  "quote": "« Oui, le prix des épices vendues au kilo prennent l'ascenseur. »",
  "expansion": "生动形象表达。同义：grimper en flèche, flamber",
  "mastered": false
 },
 {
  "id": 4,
  "fr": "faire un malheur",
  "type": "loc. verb.",
  "category": "idiom",
  "zh": "大获成功、大受好评、极为畅销",
  "quote": "« Oui, le gingembre qui fait un malheur en Suisse... »",
  "expansion": "反意修辞：非“灾祸”，而是 remporter un vif succès",
  "mastered": false
 },
 {
  "id": 5,
  "fr": "donner un coup de fouet",
  "type": "loc. verb.",
  "category": "idiom",
  "zh": "令人振奋、提神醒脑、注入活力",
  "quote": "« ...un univers de concentré de gingembre qui donne un coup de fouet. »",
  "expansion": "引申：带来立竿见影的刺激作用（stimuler immédiatement）",
  "mastered": false
 },
 {
  "id": 6,
  "fr": "la facture est salée",
  "type": "loc. verb.",
  "category": "idiom",
  "zh": "账单沉重、开销昂贵",
  "quote": "« Côté prix, la facture des épices est-elle salée...? »",
  "expansion": "双关修辞：salé(e) 原意指咸味调料，此处指价格极高",
  "mastered": false
 },
 {
  "id": 7,
  "fr": "éplucher",
  "type": "v. tr.",
  "category": "idiom",
  "zh": "削皮；深入剖析、严密审查",
  "quote": "« Bastien Von Wyss, il a creusé le sujet et épluché le gingembre. »",
  "expansion": "双关：给生姜削皮 vs 严密核查（scruter / examiner de près）",
  "mastered": false
 },
 {
  "id": 8,
  "fr": "légende urbaine",
  "type": "loc. nom. f.",
  "category": "idiom",
  "zh": "都市传说、毫无根据的民间传闻",
  "quote": "« Ben alors, vérité ou légende urbaine ? »",
  "expansion": "常与 mythe, rumeur infondée 互换，反义为 fait avéré",
  "mastered": false
 },
 {
  "id": 9,
  "fr": "en l'occurrence",
  "type": "loc. adv.",
  "category": "logic",
  "zh": "在这种情况下、具体来说",
  "quote": "« ...le poivre est importé en l'occurrence du Cambodge ou du Vietnam... »",
  "expansion": "议论文高阶连接词，明确聚焦于具体讨论的对象",
  "mastered": false
 },
 {
  "id": 10,
  "fr": "prendre en compte",
  "type": "loc. verb.",
  "category": "logic",
  "zh": "考虑到、将……纳入考量",
  "quote": "« ...les douanes prennent toujours en compte le lieu de la dernière transformation... »",
  "expansion": "C1 议论高频：同义于 prendre en considération",
  "mastered": false
 },
 {
  "id": 11,
  "fr": "en provenance de",
  "type": "loc. prép.",
  "category": "logic",
  "zh": "来自、源自、始发于",
  "quote": "« ...des vagues successives de migration en provenance de Méditerranée... »",
  "expansion": "接产地或始发地，相当于 originaire de / venant de",
  "mastered": false
 },
 {
  "id": 12,
  "fr": "fulgurant, -e",
  "type": "adj.",
  "category": "logic",
  "zh": "极迅猛的、闪电般的",
  "quote": "« ...comment expliquer le succès fulgurant des épices sur les tables suisses ? »",
  "expansion": "固定高阶搭配：ascension fulgurante / hausse fulgurante",
  "mastered": false
 },
 {
  "id": 13,
  "fr": "corsé, -e",
  "type": "adj.",
  "category": "logic",
  "zh": "浓烈的；辛辣刺激的、棘手的",
  "quote": "« Une info corsée qui va pimenter cette émission... »",
  "expansion": "既指食物浓郁，又指有内涵、有挑战性（piquante / relevée）",
  "mastered": false
 },
 {
  "id": 14,
  "fr": "métissé, -e",
  "type": "adj.",
  "category": "logic",
  "zh": "混血的、文化交融的、多元融合的",
  "quote": "« Oui, la société suisse est de plus en plus métissée. »",
  "expansion": "名词形式为 le métissage culturel（文化融汇）",
  "mastered": false
 },
 {
  "id": 15,
  "fr": "assaisonner",
  "type": "v. tr.",
  "category": "logic",
  "zh": "调味；使言论更有风趣",
  "quote": "« ...assaisonner un plat... »",
  "expansion": "派生词：l'assaisonnement (m.)；比喻用法为 pimenter",
  "mastered": false
 },
 {
  "id": 16,
  "fr": "le gingembre",

/* ---------- data ---------- */
const CATS = [
  ['expr', '习语与表达'], ['logic', '论证与连接'], ['verb', '动词'], ['noun', '名词'], ['adj', '形容词与副词'],
];
const STORE_KEY = 'dalf_c1_vocab', PREF_KEY = 'dalf_c1_flash_prefs';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// quotes may carry <strong> around the word; nothing else is allowed through
const safeQuote = q => esc(q).replace(/&lt;(\/?)strong&gt;/g, '<$1strong>').replace(/&lt;br\s*\/?&gt;/g, '<br>');
const cardKey = c => String(c.fr || '').toLowerCase().normalize('NFC').replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();

// A card is "custom" when it was added in the browser (by hand or from the exam page): its id is a timestamp.
const isCustom = c => !!(c.custom || c.addedAt || Number(c.id) >= 1e12);
// Old cards used idiom / logic / noun: sort those by part of speech into the five categories.
function categoryOf(c) {
  if (CATS.some(k => k[0] === c.category) && (isCustom(c) || c.category === 'verb')) return c.category;
  const t = String(c.type || '').toLowerCase();
  if (/^v\./.test(t)) return 'verb';
  if (/^adj|^adv|p\. ?p\./.test(t)) return 'adj';
  if (/^n\./.test(t)) return 'noun';
  if (/loc\. ?(adv|prép|conj)|^conj|^prép/.test(t)) return 'logic';
  return c.category === 'logic' ? 'logic' : 'expr';
}
// Add cards that are not in the set yet (import, exam page). Existing cards are never overwritten.
function mergeCards(base, extra) {
  const out = base.map(c => ({ ...c })), seen = new Set(out.map(cardKey)), ids = new Set(out.map(c => String(c.id)));
  let added = 0;
  for (const c of extra || []) {
    if (!c || !c.fr || seen.has(cardKey(c))) continue;
    const card = { mastered: false, ...c, custom: true };
    if (card.id == null || ids.has(String(card.id)) || Number(card.id) < 1e12) card.id = Date.now() + Math.floor(Math.random() * 1e6);
    out.push(card); seen.add(cardKey(card)); ids.add(String(card.id)); added++;
  }
  out.forEach(c => { c.category = categoryOf(c); });
  return { cards: out, added };
}
// The file is the reference for the built-in cards; the browser only keeps "mastered" and the custom cards.
function loadVocab() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
  saved = Array.isArray(saved) ? saved : [];
  const mastered = new Map(saved.map(v => [String(v.id), !!v.mastered]));
  const builtin = initialVocabulary.map(v => ({ ...v, mastered: mastered.has(String(v.id)) ? mastered.get(String(v.id)) : !!v.mastered }));
  const taken = new Set(builtin.map(cardKey));
  const custom = saved.filter(v => isCustom(v) && v.fr && !taken.has(cardKey(v))).map(v => ({ ...v, custom: true }));
  const all = [...custom, ...builtin];
  all.forEach(c => { c.category = categoryOf(c); });
  return all;
}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(vocabulary)); } catch (e) {} };

let vocabulary = loadVocab();
let prefs = { theme: '', onlyTodo: false, rate: 1 };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} };
let filter = 'all', deck = [], index = 0, flipped = false, view = 'cards';

/* ---------- helpers ---------- */
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('open'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('open'), 2400); }
function applyTheme() { if (prefs.theme) document.documentElement.dataset.theme = prefs.theme; else delete document.documentElement.dataset.theme; }
const inFilter = c => (filter === 'all' || c.category === filter) && !(prefs.onlyTodo && c.mastered);

/* ---------- speech (browser voices) ---------- */
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('这个浏览器不支持朗读'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/,\s*-\w+$/, '').replace(/<[^>]+>/g, ''));
  const voices = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang));
  u.voice = voices.find(v => /Google|Amélie|Thomas|Audrey|Premium|Enhanced/i.test(v.name) && /fr[-_]FR/i.test(v.lang)) || voices.find(v => /fr[-_]FR/i.test(v.lang)) || voices[0] || null;
  u.lang = 'fr-FR'; u.rate = prefs.rate;
  speechSynthesis.speak(u);
}

/* ---------- rendering ---------- */
function renderPills() {
  const n = c => vocabulary.filter(v => c === 'all' || v.category === c).length;
  $('pills').innerHTML = [['all', '全部'], ...CATS].map(([id, label]) => `<button data-cat="${id}" class="${filter === id ? 'on' : ''}">${label} ${n(id)}</button>`).join('');
  const m = vocabulary.filter(v => v.mastered).length;
  $('nMastered').textContent = m; $('nReview').textContent = vocabulary.length - m;
  $('btnOnlyTodo').classList.toggle('on', prefs.onlyTodo);
}
function rebuildDeck(keepId) {
  if (filter !== 'all' && !vocabulary.some(v => v.category === filter)) filter = 'all';
  deck = vocabulary.filter(inFilter);
  const k = keepId == null ? -1 : deck.findIndex(c => String(c.id) === String(keepId));
  index = k >= 0 ? k : Math.min(index, Math.max(0, deck.length - 1));
}
function renderCard() {
  const c = deck[index];
  $('deck').hidden = !c; $('deckEmpty').hidden = !!c;
  if (!c) { $('deckEmpty').textContent = prefs.onlyTodo ? '这个筛选下的卡片都已掌握 🎉' : '这个筛选下没有卡片。'; return; }
  $('cardInner').classList.toggle('flipped', flipped);
  $('pos').textContent = `第 ${index + 1} / ${deck.length} 张`;
  $('catBadge').textContent = (CATS.find(k => k[0] === c.category) || [, '词汇'])[1];
  $('progress').style.width = ((index + 1) / deck.length * 100) + '%';
  $('word').textContent = c.fr; $('type').textContent = c.type ? `[${c.type}]` : '';
  $('hint').textContent = String(c.quote || '').split(/<br\s*\/?>/)[0].replace(/<[^>]+>/g, '');
  $('zh').textContent = c.zh || ''; $('typeBack').textContent = c.type || '';
  $('quote').innerHTML = safeQuote(c.quote || '（没有原句）');
  $('source').textContent = c.source ? ' · ' + c.source : '';
  $('expansion').textContent = c.expansion && c.expansion !== '无' ? c.expansion : '';
  const b = $('btnMaster'); b.classList.toggle('done', !!c.mastered); b.textContent = c.mastered ? '✓ 已掌握' : '标为已掌握';
  $('btnSpeed').textContent = prefs.rate.toFixed(1) + '×';
}
function renderList() {
  const q = $('search').value.toLowerCase().trim();
  const items = vocabulary.filter(inFilter).filter(c => !q || [c.fr, c.zh, c.quote, c.expansion].some(x => String(x || '').toLowerCase().includes(q)));
  $('rows').innerHTML = items.length ? items.map(c => `<div class="row" data-id="${esc(c.id)}">
      <button class="chk ${c.mastered ? 'done' : ''}" data-act="master" title="${c.mastered ? '取消掌握' : '标为已掌握'}">●</button>
      <div><span class="fr">${esc(c.fr)}</span><span class="ty">${esc(c.type || '')} · ${esc((CATS.find(k => k[0] === c.category) || [, ''])[1])}</span>
        <div class="zhs">${esc(c.zh || '')}</div>
        ${c.quote ? `<div class="q">${safeQuote(c.quote)}${c.source ? ` <span style="font-style:normal;color:var(--ink3);font-size:12px">— ${esc(c.source)}</span>` : ''}</div>` : ''}
        ${c.expansion && c.expansion !== '无' ? `<div class="ex">${esc(c.expansion)}</div>` : ''}</div>
      <div class="acts"><button data-act="speak" title="朗读">🔊</button><button data-act="open" title="在闪卡里打开">↗</button><button class="del" data-act="del" title="删除">✕</button></div>
    </div>`).join('') : `<p class="empty">没有符合条件的卡片</p>`;
}
function renderAll(keepId) { rebuildDeck(keepId); renderPills(); renderCard(); if (view === 'list') renderList(); }
function setView(v) {
  view = v; $('viewCards').hidden = v !== 'cards'; $('viewList').hidden = v !== 'list';
  $('tabCards').classList.toggle('on', v === 'cards'); $('tabList').classList.toggle('on', v === 'list');
  if (v === 'list') renderList();
}

/* ---------- actions ---------- */
const current = () => deck[index];
function go(d) { if (!deck.length) return; index = (index + d + deck.length) % deck.length; flipped = false; renderCard(); }
function flip() { if (!current()) return; flipped = !flipped; $('cardInner').classList.toggle('flipped', flipped); }
function toggleMaster(card) {
  if (!card) return;
  card.mastered = !card.mastered; save();
  toast(card.mastered ? `已掌握：${card.fr}` : `取消掌握：${card.fr}`);
  // with "only not mastered" on, the card leaves the deck: stay at the same position
  const keep = prefs.onlyTodo && card.mastered ? null : card.id;
  if (keep == null) flipped = false;
  renderAll(keep);
}

$('card').addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (getSelection().toString().trim()) return;            // selecting text (dictionary lookup) must not flip
  flip();
});
$('btnPrev').onclick = () => go(-1);
$('btnNext').onclick = () => go(1);
$('btnMaster').onclick = () => toggleMaster(current());
$('btnShuffle').onclick = () => { for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } index = 0; flipped = false; renderCard(); toast('已打乱顺序'); };
$('btnSpeak').onclick = $('btnSpeak2').onclick = () => current() && speak(current().fr);
$('btnSpeed').onclick = () => { const s = [1, 0.8, 0.6]; prefs.rate = s[(s.indexOf(prefs.rate) + 1) % s.length]; savePrefs(); renderCard(); };
$('btnCopy').onclick = async () => { try { await navigator.clipboard.writeText(current().fr); toast('已复制：' + current().fr); } catch (e) { toast('复制失败'); } };
$('btnDict').onclick = () => { const w = current().fr.replace(/,\s*-\w+$/, '').replace(/^(le |la |les |l'|l’|un |une |des )/i, '').trim(); window.open('https://www.larousse.fr/dictionnaires/francais/' + encodeURIComponent(w), '_blank', 'noopener'); };
$('pills').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; filter = b.dataset.cat; index = 0; flipped = false; renderAll(); });
$('btnOnlyTodo').onclick = () => { prefs.onlyTodo = !prefs.onlyTodo; savePrefs(); index = 0; flipped = false; renderAll(); };
$('btnReset').onclick = () => { if (!confirm('把所有卡片标回"未掌握"？')) return; vocabulary.forEach(v => v.mastered = false); save(); renderAll(); toast('学习进度已重置'); };
$('tabCards').onclick = () => setView('cards');
$('tabList').onclick = () => setView('list');
$('search').oninput = renderList;
$('btnTheme').onclick = () => { const dark = prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; prefs.theme = dark ? 'light' : 'dark'; savePrefs(); applyTheme(); };
$('rows').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const card = vocabulary.find(v => String(v.id) === b.closest('.row').dataset.id); if (!card) return;
  if (b.dataset.act === 'speak') speak(card.fr);
  else if (b.dataset.act === 'master') toggleMaster(card);
  else if (b.dataset.act === 'open') { prefs.onlyTodo = false; filter = 'all'; flipped = false; renderAll(card.id); setView('cards'); }
  else if (b.dataset.act === 'del') { if (!confirm(`删除卡片「${card.fr}」？`)) return; vocabulary = vocabulary.filter(v => v !== card); save(); renderAll(); toast('已删除：' + card.fr); }
});

/* add */
$('fCat').innerHTML = CATS.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
$('btnAdd').onclick = () => { $('addModal').classList.add('open'); $('fFr').focus(); };
$('addCancel').onclick = () => $('addModal').classList.remove('open');
$('addModal').addEventListener('mousedown', e => { if (e.target === $('addModal')) $('addModal').classList.remove('open'); });
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const fr = $('fFr').value.trim(), zh = $('fZh').value.trim(); if (!fr || !zh) return;
  if (vocabulary.some(v => cardKey(v) === cardKey({ fr }))) { toast('这张卡片已经有了：' + fr); return; }
  const q = $('fQuote').value.trim();
  const card = { id: Date.now(), fr, type: $('fType').value.trim() || 'exp.', category: $('fCat').value, zh,
    quote: q ? (q.startsWith('«') ? q : `« ${q} »`) : '', expansion: $('fExp').value.trim() || '无', mastered: false, addedAt: new Date().toISOString(), custom: true };
  vocabulary.unshift(card); save(); e.target.reset(); $('addModal').classList.remove('open');
  filter = 'all'; flipped = false; renderAll(card.id); toast('已新增：' + fr);
});

/* export / import */
$('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'dalf-c1-flashcards', version: 1, exportedAt: new Date().toISOString(), cards: vocabulary }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cards.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast(`已导出 ${vocabulary.length} 张卡片`);
};
$('btnImport').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result), list = Array.isArray(data) ? data : data.cards;
      if (!Array.isArray(list)) throw new Error('format');
      const r = mergeCards(vocabulary, list); vocabulary = r.cards; save(); renderAll(current() && current().id);
      toast(r.added ? `导入完成：新增 ${r.added} 张` : '导入完成：没有新卡片');
    } catch (err) { toast('导入失败：不是有效的卡片文件'); }
    e.target.value = '';
  };
  reader.readAsText(file);
};

/* cards added from the exam page (same site, another tab) show up at once */
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY) return;
  const before = vocabulary.length, keep = current() && current().id;
  vocabulary = loadVocab(); renderAll(keep);
  if (vocabulary.length > before) toast(`新加入 ${vocabulary.length - before} 张卡片`);
});
window.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || view !== 'cards' || $('addModal').classList.contains('open')) return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if (e.key === 'm' || e.key === 'M') toggleMaster(current());
});

applyTheme();
save();            // persist the merged, re-categorised set
renderAll();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
</body>
</html>
